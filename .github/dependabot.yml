# Dependabot — actualizaciones automáticas de dependencias.
#
# Dependabot abre cada lunes los PR de actualización. Los avisos de seguridad NO se
# silencian: el paso «Auditoría de dependencias» del CI de cada PR dice si el aviso quedó
# resuelto. Historia: nació el 2026-10-04 por el aviso de `braces` (retirado por GitHub el
# 2026-10-23); el CI de `main` volvió a verde el 2026-10-27 con Zod 4 (ADR 005).
version: 2
updates:
  - package-ecosystem: "npm" # cubre pnpm (pnpm-lock.yaml y catálogo)
    # Solo la raíz (2026-10-10): en un workspace pnpm el lockfile vive en "/".
    # Vigilar /apps/web y /packages/shared por separado generaba PRs duplicados
    # que no actualizaban el lockfile y fallaban con ERR_PNPM_OUTDATED_LOCKFILE.
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Santiago"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Zod ya está en 4 (ADR 005). El siguiente cambio mayor (5) se migra como tarea
      # planificada, no por PR automático: los menores y parches de la 4 sí llegan solos.
      - dependency-name: "zod"
        update-types: ["version-update:semver-major"]
    groups:
      # Next.js y su config de ESLint se actualizan juntos (misma versión).
      next:
        patterns:
          - "next"
          - "eslint-config-next"
          - "@next/*"
      dev-menores:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Santiago"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # `init` y `analyze` de CodeQL deben subir juntos a la misma versión: si llegan en PRs
      # separados, el análisis se rompe al fusionar uno sin el otro (pasó con los PR #34/#35,
      # #36/#37 y #43/#45).
      codeql:
        patterns:
          - "github/codeql-action/*"
