# ============================================================================
# CI — rutadecarrera-platform
# ----------------------------------------------------------------------------
# Regla #6 de gobernanza: este CI DEBE poder fallar. Ningún paso usa
# continue-on-error: si lint, tipos, tests, cobertura o auditoría fallan,
# el job queda en rojo y (con la protección de main) el PR no se puede mergear.
#
# Ejecuta exactamente los mismos comandos que docs/setup.md pide correr en
# local, con las mismas versiones (Node desde .nvmrc, pnpm desde packageManager).
#
# Acciones fijadas por SHA de commit (una etiqueta puede moverse; un SHA no).
# ============================================================================
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # Semanal: detecta vulnerabilidades nuevas aunque no haya PRs abiertos.
  schedule:
    - cron: '0 12 * * 1' # lunes 09:00 hora de Chile (12:00 UTC)
  workflow_dispatch:

# Mínimo privilegio: el CI solo necesita leer el código.
permissions:
  contents: read

# Si llega un commit nuevo al mismo PR, se cancela la ejecución anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    # Este nombre es el que se marca como "check obligatorio" en la protección de main.
    name: verificar
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Instalar pnpm (versión desde packageManager)
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Instalar Node (versión desde .nvmrc)
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias (exactas, desde el lockfile)
        run: pnpm install --frozen-lockfile

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Tipos (TypeScript)
        run: pnpm typecheck

      - name: Tests y cobertura (mínimo 80%, falla si baja)
        run: pnpm test:coverage

      # Falla con vulnerabilidades altas o críticas. Si aparece una nueva sin
      # parche disponible, se documenta la excepción en el PR; no se desactiva
      # este paso.
      - name: Auditoría de dependencias
        run: pnpm audit --audit-level=high
