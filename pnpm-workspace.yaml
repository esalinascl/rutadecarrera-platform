packages:
  - 'apps/*'
  - 'packages/*'

# No ejecutar scripts de instalación de dependencias salvo aprobación explícita.
allowBuilds:
  unrs-resolver: false

# FUENTE ÚNICA de versiones compartidas: los package.json usan "catalog:".
# Para subir Next en las 3 apps se cambia SOLO esta línea.
catalog:
  next: ^16.3.6
  react: ^18.2.0
  react-dom: ^18.2.0
  '@types/react': ^18.2.0
  '@types/react-dom': ^18.2.0
  '@types/node': ^24.0.0
  typescript: ^5.0.0
  eslint: ^9.0.0
  eslint-config-next: ^16.3.6
  prettier: ^3.0.0
